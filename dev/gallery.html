<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>素材图鉴 · Claude 大头贴照相馆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;700&family=Long+Cang&display=swap"

    <style>
      body { margin: 0; padding: 24px; background: #faf9f5; color: #141413; font: 14px/1.5 Poppins, 'Noto Sans SC', sans-serif; }
      h2 { font: 600 22px Lora, 'Noto Serif SC', serif; margin: 28px 0 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
      figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
      figcaption { font-size: 12px; color: #73726c; }
      canvas, img { background: #fff; border: 1px solid #e8e6dc; border-radius: 8px; max-width: 100%; }
      .dark canvas { background: #1f1e1d; }

  </head>

    <div id="root"></div>
